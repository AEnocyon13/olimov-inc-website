name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cloudflare Pages serves at the domain root, so PAGES_BASE stays unset
      # and astro.config falls back to "/". SITE_URL only feeds the canonical
      # and hreflang tags; set it as a repository variable once the project
      # has its address (Settings > Secrets and variables > Actions > Variables).
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Skips cleanly (rather than failing red) until the Cloudflare
      # credentials are added to the repository secrets.
      - name: Check credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=olimov-inc-website

      - name: Credentials missing
        if: steps.cf.outputs.ready != 'true'
        run: |
          echo "::notice::Build succeeded. Add CLOUDFLARE_API_TOKEN and \
          CLOUDFLARE_ACCOUNT_ID to the repository secrets to publish."
