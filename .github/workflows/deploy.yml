name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-ready: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pages is unavailable while the repository is private on a free plan.
      # Allowed to fail so a push still goes green; the deploy job below is
      # skipped until Pages can be resolved, and resumes on its own once the
      # repository is public again.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Pages not enabled
        if: steps.pages.outcome != 'success'
        run: echo "::notice::Build succeeded. Publishing is paused because GitHub Pages is not enabled — a private repository on the free plan cannot use it."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: ./dist

  deploy:
    needs: build
    if: needs.build.outputs.pages-ready == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
